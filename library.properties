name=CommutateI2C
version=2.2.0
author=HioSW
maintainer=HioSW
sentence=Autonomous I2C switch/router for Arduino Nano.
paragraph=CRC8-protected packet routing between multiple Arduino Nano boards over a single I2C bus. Master auto-discovers slaves, polls them round-robin, delivers packets, reports ACK/NACK. Slave has a ring queue, autosend demo generator and per-message delivery callback. Optional 16x2 LCD status panel and Serial CLI.
